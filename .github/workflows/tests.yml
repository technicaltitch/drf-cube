name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }} / DRF ${{ matrix.drf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # These compatible combinations cover every supported Python and Django
      # release, plus DRF 3.14 through the current 3.18 release line.
      matrix:
        include:
          - python: "3.11"
            django: "4.2.*"
            drf: "3.14.*"
          - python: "3.11"
            django: "4.2.*"
            drf: "3.15.*"
          - python: "3.12"
            django: "5.0.*"
            drf: "3.15.*"
          - python: "3.13"
            django: "5.1.*"
            drf: "3.16.*"
          - python: "3.13"
            django: "5.2.*"
            drf: "3.16.*"
          - python: "3.13"
            django: "5.2.*"
            drf: "3.17.*"
          - python: "3.13"
            django: "6.0.*"
            drf: "3.17.*"
          - python: "3.13"
            django: "6.1.*"
            drf: "3.18.*"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and matrix dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable . "Django==${{ matrix.django }}" "djangorestframework==${{ matrix.drf }}"
      - name: Run unit tests
        run: python -m tests.runtests

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: python -m pip install --editable ".[docs]"
      - name: Build documentation
        run: sphinx-build --fail-on-warning --keep-going -b html docs docs/_build/html
